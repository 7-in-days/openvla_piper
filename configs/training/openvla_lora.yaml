schema_version: 1

paths:
  data_root: artifacts/rlds
  run_root: artifacts/training
  base_model: artifacts/models/openvla/openvla-7b
  source_schema: /home/pc/vla_pipeline/episodes/two_block_pnp/meta/info.json
  robot_contract: configs/training/piper_robot_contract.json

dataset:
  name: piper_bridge
  version: 1.0.0
  control_hz: 20.0

model:
  action_horizon: 50
  num_images_in_input: 2
  use_proprio: true
  use_film: false
  use_l1_regression: true
  use_diffusion: false

training:
  batch_size: 1
  gradient_accumulation: 8
  shuffle_buffer_size: 10000
  learning_rate: 5.0e-4
  lr_warmup_steps: 0
  num_steps_before_decay: 50000
  max_steps: 100000
  use_val_set: true
  val_freq: 10000
  val_time_limit: 180
  save_freq: 10000
  save_latest_checkpoint_only: false
  image_aug: true

lora:
  rank: 32
  alpha: null
  dropout: 0.0
  merge_during_training: true

tracking:
  wandb_mode: offline
  entity: piper-local
  project: openvla-piper
  run_id_note: null
